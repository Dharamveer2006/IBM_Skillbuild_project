# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Deploy GitHub Pages from docs/ folder
# Triggers on every push to main branch.
#
# Setup steps (do once):
#   1. Push this repo to GitHub
#   2. Go to Settings → Pages → Source: Deploy from a branch → Branch: main → /docs
#   3. Click Save — your site will be live at:
#      https://<your-username>.github.io/IBM_Skillbuild_project/
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:       # allow manual trigger from Actions tab

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"          # serve everything inside docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
